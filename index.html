<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kids English Grammar Learning App</title>
<!-- 🎨 SweetAlert2 CDN for Premium App Dialogs -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="app.css">
</head>
<body onclick="unlockAudioOnce()">

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <h2>
      स्वागत है!
      <span class="secret-hand-btn" onclick="toggleSecretAdmin()" title="शिक्षक मोड">👋</span>
    </h2>
    <p id="login-subtext">इंग्लिश ग्रामर पाठशाला में लॉगिन करें:</p>

    <div id="student-login-box">
      <div class="field-group">
        <label>छात्र का नाम (Username):</label>
        <input type="text" id="stu-username" class="field-input" placeholder="उदा. arham">
      </div>
      <div class="field-group">
        <label>पासवर्ड:</label>
        <input type="password" id="stu-pass" class="field-input" placeholder="पासवर्ड लिखें">
      </div>
      <button class="btn-submit-login" onclick="loginStudent()">पढ़ाई शुरू करें 🚀</button>
    </div>

    <div id="admin-login-box" style="display:none;">
      <div style="background:#EDE9FE;color:#5B21B6;font-size:12px;font-weight:800;padding:6px;border-radius:8px;margin-bottom:12px;">
        👑 शिक्षक / एडमिन पोर्टल
      </div>
      <div class="field-group">
        <label>Admin Security Password:</label>
        <input type="password" id="admin-pin" class="field-input" placeholder="पासवर्ड दर्ज करें">
      </div>
      <button class="btn-submit-login" style="background:var(--purple);" onclick="loginAdmin()">Admin Login 🔓</button>
      <span class="admin-cancel-link" onclick="toggleSecretAdmin()">← वापस छात्र लॉगिन पर जाएँ</span>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app">
  <div class="container">

    <div class="user-bar">
      <div>
        <span id="role-badge" class="user-badge badge-student">Student</span>
        <span id="display-username" style="font-weight:700;margin-left:6px;">आरव</span>
      </div>
      <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>

    <header>
      <h1>🎓 इंग्लिश ग्रामर पाठशाला 🎓</h1>
      <p>सुनो, समझो और खेल-खेल में सीखो!</p>
    </header>

    <!-- 📚 डायनामिक चैप्टर सिलेक्टर बार -->
    <div class="voice-picker-box" style="margin-bottom: 10px; background: #EEF2FF; border: 1.5px solid #C7D2FE;">
      <label style="color: #4338CA; font-weight: 800;">📚 चैप्टर चुनें:</label>
      <select id="selected-chapter" class="voice-select" onchange="switchChapter(this.value)">
        <!-- Options JavaScript द्वारा अपने आप लोड होंगे -->
      </select>
    </div>

    <!-- वॉइस सिलेक्टर बार -->
    <div class="voice-picker-box">
      <label>🎙️ AI आवाज़ चुनें:</label>
      <select id="selected-voice" class="voice-select" onchange="stopAllPlayback()">
        <option value="en-IN-NeerjaNeural">🇮🇳 Neerja (English - Indian Accent)</option>
        <option value="hi-IN-MadhurNeural" selected>🇮🇳 Madhur (हिंदी - Male Accent)</option>
        <option value="hi-IN-SwaraNeural">🇮🇳 Swara (हिंदी - Female Accent)</option>
      </select>
    </div>

    <div id="status-bar">🔊 आवाज़ रेडी है! किसी भी बटन पर टैप करें।</div>

    <div id="admin-panel">
      <div class="admin-title">⚙️ Admin Controls (वॉइस और छात्र मैनेजमेंट)</div>
      <div class="admin-actions">
        <button class="btn-sync" onclick="exportVoices()">📥 Download All Voices</button>
        <button class="btn-sync" onclick="document.getElementById('file-input').click()">📤 Upload Voices File</button>
        <input type="file" id="file-input" style="display:none" accept=".json" onchange="importVoices(event)">
      </div>
      <div style="font-size:12px;font-weight:700;color:#5B21B6;margin-bottom:6px;">➕ नया छात्र जोड़ें:</div>
      <div class="add-student-box">
        <input type="text" id="new-stu-name" placeholder="छात्र का नाम लिखें">
        <button onclick="addNewStudent()">Add Student</button>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs-wrapper">
      <div class="tabs">
        <button class="tab-btn active" onclick="openTab(0)">🌟 Understanding</button>
        <button class="tab-btn" onclick="openTab(1)">Exercise A</button>
        <button class="tab-btn" onclick="openTab(2)">Exercise B</button>
        <button class="tab-btn" onclick="openTab(3)">Exercise C</button>
        <button class="tab-btn" onclick="openTab(4)">Exercise D</button>
      </div>
    </div>

    <!-- DYNAMIC TABS CONTAINER -->
    <div id="tab-0" class="content-section active"></div>
    <div id="tab-1" class="content-section"></div>
    <div id="tab-2" class="content-section"></div>
    <div id="tab-3" class="content-section"></div>
    <div id="tab-4" class="content-section"></div>

  </div>
</div>

<script src="data.js"></script>
<script src="kidSscript.js"></script>
<script src="app.js"></script>
</body>
</html>
